
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Students</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            text-align: center;
        }
        header {
            background: #174a7e;
            color: white;
            padding: 20px;
        }
        table {
            width: 85%;
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 13px;
            border: 1px solid #ccc;
        }
        th {
            background: #174a7e;
            color: white;
        }
        tr:nth-child(even) {
            background: #eaf1f8;
        }
        a {
            display: inline-block;
            margin: 15px;
            color: #174a7e;
        }
    </style>
</head>
<body>
    <header>
        <h1>Student Records</h1>
    </header>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Year</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student['id'] }}</td>
                <td>{{ student['name'] }}</td>
                <td>{{ student['department'] }}</td>
                <td>{{ student['year'] }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4">No student records found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/add">Add Another Student</a>
    <a href="/">Home</a>
</body>
</html>
